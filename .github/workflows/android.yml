name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Das Runner-Image bringt das Android-SDK schon mit; hier nur die Pakete für das Projekt nachziehen.
      - name: Android-SDK-Pakete installieren
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Unit-Tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Debug-APK bauen
        run: ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: punktgenau-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
