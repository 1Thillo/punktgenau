name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: "Tag, z. B. v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Tag und versionName vergleichen
        run: |
          VERSION=$(grep -oP 'appVersionName = "\K[^"]+' android/app/build.gradle.kts | head -n 1)
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "Tag $TAG passt nicht zu versionName $VERSION in android/app/build.gradle.kts" >&2
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android-SDK-Pakete installieren
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(ls -d "$SDKROOT"/cmdline-tools/*/bin | head -n 1)/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Signierschlüssel bereitstellen
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Release-APK bauen
        working-directory: android
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Datei umbenennen und Prüfsumme erzeugen
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "punktgenau-${TAG}.apk"
          sha256sum "punktgenau-${TAG}.apk" > "punktgenau-${TAG}.apk.sha256"

      - name: GitHub-Release anlegen oder ergänzen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="punktgenau-${TAG}.apk punktgenau-${TAG}.apk.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --title "punktgenau ${TAG}" --generate-notes
          fi
