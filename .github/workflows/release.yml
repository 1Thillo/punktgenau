name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag und versionName vergleichen
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG passt nicht zu versionName $VERSION in android/app/build.gradle.kts" >&2
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android-SDK-Pakete installieren
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(ls -d "$SDKROOT"/cmdline-tools/*/bin | head -n 1)/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Signierschlüssel bereitstellen
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Release-APK bauen
        working-directory: android
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Datei umbenennen und Prüfsumme erzeugen
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "punktgenau-${GITHUB_REF_NAME}.apk"
          sha256sum "punktgenau-${GITHUB_REF_NAME}.apk" > "punktgenau-${GITHUB_REF_NAME}.apk.sha256"

      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "punktgenau-${GITHUB_REF_NAME}.apk" \
            "punktgenau-${GITHUB_REF_NAME}.apk.sha256" \
            --title "punktgenau ${GITHUB_REF_NAME}" \
            --generate-notes
